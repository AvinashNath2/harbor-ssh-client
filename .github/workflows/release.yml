name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (arm64)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
            label: macOS-arm64

          # macOS — Intel (x86_64)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
            label: macOS-x86_64

          # macOS — Universal binary (arm64 + x86_64 combined)
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            target: ''
            label: macOS-universal

          # Linux — produces AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
            target: ''
            label: Linux

          # Windows — produces .msi + NSIS installer + portable ZIP
          - platform: windows-latest
            args: ''
            target: ''
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install macOS Universal targets
        if: matrix.label == 'macOS-universal'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssh-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HarborSCP ${{ github.ref_name }}'
          releaseBody: |
            ## HarborSCP ${{ github.ref_name }}

            ### Downloads

            | Platform | Installer | Portable (no install needed) |
            |----------|-----------|------------------------------|
            | macOS Apple Silicon | `HarborSCP_*_aarch64.dmg` | — |
            | macOS Intel | `HarborSCP_*_x64.dmg` | — |
            | macOS Universal | `HarborSCP_*_universal.dmg` | — |
            | Linux | `harbor-scp_*_amd64.AppImage` · `harbor-scp_*_amd64.deb` | — |
            | Windows | `HarborSCP_*_x64-setup.exe` · `HarborSCP_*_x64_en-US.msi` | `HarborSCP_*_x64_portable.zip` ← extract & run |

            > **Corporate laptop?** Download the portable ZIP — no installation or admin rights required.
            > Extract the folder and run `HarborSCP.exe` directly.

            ### What's new
            See the [CHANGELOG](https://github.com/AvinashNath2/harbor-ssh-client/blob/main/CHANGELOG.md) for full release notes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ── Windows-only: package a portable ZIP (extract & run, no install needed) ──
      - name: Create portable ZIP (Windows)
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          # Tauri names the binary after productName in tauri.conf.json
          $exePath = "src-tauri\target\release\HarborSCP.exe"
          if (-not (Test-Path $exePath)) {
            # Fallback: search for any .exe in the release dir
            $exePath = Get-ChildItem "src-tauri\target\release\" -Filter "*.exe" `
              | Where-Object { $_.Name -notmatch "build|deps|examples" } `
              | Select-Object -First 1 -ExpandProperty FullName
          }
          if ($exePath) {
            Write-Host "Packaging: $exePath"
            $zipName = "HarborSCP_${{ github.ref_name }}_x64_portable.zip"
            Compress-Archive -Path $exePath -DestinationPath $zipName -Force
            Write-Host "Created: $zipName"
          } else {
            Write-Error "Could not find HarborSCP.exe — listing release dir:"
            Get-ChildItem "src-tauri\target\release\" -Filter "*.exe"
            exit 1
          }

      - name: Upload portable ZIP to release
        if: matrix.label == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "HarborSCP_${{ github.ref_name }}_x64_portable.zip" \
            --clobber
